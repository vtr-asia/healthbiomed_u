<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>好健康 - 勞工體格管理分析系統</title>
    <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%); min-height: 100vh; }
        .card { background: white; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); transition: all 0.3s; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.12); }
        .chart-container { position: relative; height: 360px; }
        .detail-panel { max-height: 0; overflow: hidden; transition: max-height 0.4s ease; }
        .detail-panel.open { max-height: 800px; }
    </style>
</head>
<body class="p-6 md:p-10 font-sans">

    <header class="max-w-7xl mx-auto text-center mb-10">
        <div class="flex items-center justify-center gap-4 mb-4">
            <div class="w-14 h-14 rounded-full bg-gradient-to-br from-green-500 to-teal-600 flex items-center justify-center text-white font-bold text-3xl shadow-lg">健</div>
            <h1 class="text-4xl md:text-5xl font-bold text-indigo-800">好健康 - 勞工體格管理分析</h1>
        </div>
        <p id="sub-header" class="text-lg text-gray-600">載入中...</p>
    </header>

    <div id="status" class="text-center text-xl font-medium text-indigo-700 mb-10 flex items-center justify-center gap-3">
        <div class="w-8 h-8 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
        系統初始化與資料同步中...
    </div>

    <div id="charts-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mb-12 opacity-0 transition-opacity duration-800">
        <div class="card p-6 cursor-pointer" onclick="showDetail('threeHigh')">
            <h2 class="text-2xl font-semibold text-indigo-700 mb-4 text-center">三高分佈</h2>
            <div class="chart-container"><canvas id="chartThreeHigh"></canvas></div>
        </div>
        <div class="card p-6 cursor-pointer" onclick="showDetail('bmi')">
            <h2 class="text-2xl font-semibold text-indigo-700 mb-4 text-center">BMI 分級</h2>
            <div class="chart-container"><canvas id="chartBMI"></canvas></div>
        </div>
        <div class="card p-6 cursor-pointer" onclick="showDetail('metabolic')">
            <h2 class="text-2xl font-semibold text-indigo-700 mb-4 text-center">代謝症候群</h2>
            <div class="chart-container"><canvas id="chartMetabolic"></canvas></div>
        </div>
        <div class="card p-6 cursor-pointer" onclick="showDetail('egfr')">
            <h2 class="text-2xl font-semibold text-indigo-700 mb-4 text-center">腎絲球過濾率 (eGFR)</h2>
            <div class="chart-container"><canvas id="chartEGFR"></canvas></div>
        </div>
        <div class="card p-6 cursor-pointer" onclick="showDetail('bp')">
            <h2 class="text-2xl font-semibold text-indigo-700 mb-4 text-center">血壓分級</h2>
            <div class="chart-container"><canvas id="chartBPLevel"></canvas></div>
        </div>
    </div>

    <div class="card p-8 max-w-5xl mx-auto mb-12">
        <h2 class="text-3xl font-bold text-red-700 mb-6 text-center">異常員工警示清單</h2>
        <div id="abnormalList" class="space-y-4"></div>
    </div>

    <div class="max-w-7xl mx-auto text-center mt-12">
        <button onclick="exportToPDF()" class="px-10 py-5 bg-gradient-to-r from-indigo-600 to-blue-600 text-white font-bold rounded-xl shadow-lg hover:shadow-2xl transform hover:-translate-y-1 transition-all text-lg">
            下載完整 PDF 報告
        </button>
    </div>

    <div id="detailModal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-2xl p-8 max-w-4xl w-11/12 max-h-[90vh] overflow-y-auto relative shadow-2xl">
            <button onclick="closeModal()" class="absolute top-4 right-6 text-gray-600 hover:text-gray-900 text-4xl font-bold">&times;</button>
            <h3 id="modalTitle" class="text-
