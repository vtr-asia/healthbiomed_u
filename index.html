<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勞工體格管理分析系統 - FHIR 整合版</title>
    <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #f3f4f6; min-height: 100vh; font-family: sans-serif; }
        .info-pill { @apply px-4 py-1 bg-white/20 rounded-full text-sm font-medium border border-white/30; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    </style>
</head>
<body class="pb-10">

    <div id="patient-banner" class="bg-indigo-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-indigo-500 rounded-full flex items-center justify-center text-xl font-bold">
                        <span id="name-initial">?</span>
                    </div>
                    <div>
                        <div class="text-xs text-indigo-300 font-bold uppercase tracking-wider">當前檢測員工</div>
                        <div class="text-2xl font-bold leading-tight" id="disp-name">載入中...</div>
                    </div>
                </div>
                
                <div class="flex flex-wrap gap-3 items-center">
                    <div class="info-pill">ID: <span id="disp-id">--</span></div>
                    <div class="info-pill">性別: <span id="disp-gender">--</span></div>
                    <div class="info-pill">年齡: <span id="disp-age">--</span> 歲</div>
                    <div id="connection-status" class="px-3 py-1 rounded-full text-xs font-black bg-yellow-500 text-yellow-950 animate-pulse">
                        CONNECTING
                    </div>
                </div>
            </div>
        </div>
    </div>

    <main class="max-w-7xl mx-auto px-6 mt-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <div class="card p-6 border-t-4 border-indigo-500">
            <h2 class="text-lg font-bold text-gray-700 mb-4 flex items-center gap-2">
                📊 最近生理指標 (FHIR)
            </h2>
            <div id="vitals-display" class="space-y-4">
                <div class="flex justify-between border-b pb-2"><span>BMI</span><span class="font-bold text-indigo-600" id="v-bmi">--</span></div>
                <div class="flex justify-between border-b pb-2"><span>血壓</span><span class="font-bold text-indigo-600" id="v-bp">--</span></div>
                <div class="flex justify-between border-b pb-2"><span>糖化血色素</span><span class="font-bold text-indigo-600" id="v-hba1c">--</span></div>
            </div>
        </div>

        <div class="lg:col-span-2 card p-6 border-t-4 border-green-500">
            <h2 class="text-lg font-bold text-gray-700 mb-4">群體健康分佈分析</h2>
            <div class="h-64">
                <canvas id="mainChart"></canvas>
            </div>
        </div>

        <div class="lg:col-span-3 card p-6 border-t-4 border-red-500">
            <h2 class="text-lg font-bold text-red-700 mb-4">⚠️ 健康預警清單</h2>
            <div id="alert-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                </div>
        </div>
    </main>

    <script>
        // 模擬的歷史資料備援
        const backupData = [
            { name: "林o恩", bmi: 35.7, sbp: 132 },
            { name: "陳o霖", bmi: 32.9, sbp: 150 }
        ];

        async function initializeApp() {
            try {
                // 1. 等待 FHIR 授權
                const client = await FHIR.oauth2.ready();
                
                // 2. 抓取病人基本資料
                const patient = await client.patient.read();
                updatePatientBanner(patient);

                // 3. 抓取生理數據 (Observations)
                const observations = await client.request(`Observation?patient=${client.patient.id}&_sort=-date&_count=20`);
                const remoteData = processObservations(observations, patient);

                // 4. 更新 UI
                document.getElementById('connection-status').innerText = "ONLINE";
                document.getElementById('connection-status').className = "px-3 py-1 rounded-full text-xs font-black bg-green-500 text-white";
                
                renderUI([remoteData, ...backupData]);

            } catch (err) {
                console.error("FHIR Error:", err);
                showDemoMode();
            }
        }

        function updatePatientBanner(p) {
            const familyName = p.name?.[0]?.family || "";
            const givenName = p.name?.[0]?.given?.[0] || "";
            const fullName = familyName + givenName || "未知姓名";
            
            // 更新頂端欄
            document.getElementById('disp-name').innerText = fullName;
            document.getElementById('name-initial').innerText = fullName.charAt(0);
            document.getElementById('disp-id').innerText = p.id;
            document.getElementById('disp-gender').innerText = p.gender === 'male' ? '男' : p.gender === 'female' ? '女' : '未知';
            
            // 計算年齡
            if (p.birthDate) {
                const birth = new Date(p.birthDate);
                const today = new Date();
                let age = today.getFullYear() - birth.getFullYear();
                const m = today.getMonth() - birth.getMonth();
                if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
                document.getElementById('disp-age').innerText = age;
            }
        }

        function processObservations(bundle, patient) {
            const entries = bundle.entry || [];
            let record = { name: "目前員工", bmi: 0, sbp: 0, dbp: 0, glucose: 0 };
            
            entries.forEach(item => {
                const res = item.resource;
                const code = res.code?.coding?.[0]?.code;
                const val = res.valueQuantity?.value;

                if (code === "39156-5") { record.bmi = val; document.getElementById('v-bmi').innerText = val; }
                if (code === "55284-4") { // Blood Pressure
                    res.component?.forEach(c => {
                        const cCode = c.code.coding[0].code;
                        if (cCode === "8480-6") record.sbp = c.valueQuantity.value;
                        if (cCode === "8462-4") record.dbp = c.valueQuantity.value;
                    });
                    document.getElementById('v-bp').innerText = `${record.sbp}/${record.dbp}`;
                }
            });
            return record;
        }

        function renderUI(data) {
            // 更新圖表 (範例)
            const ctx = document.getElementById('mainChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.map(d => d.name),
                    datasets: [{
                        label: 'BMI 指數',
                        data: data.map(d => d.bmi),
                        backgroundColor: '#6366f1'
                    }]
                },
                options: { maintainAspectRatio: false }
            });

            // 更新警告清單
            const list = document.getElementById('alert-list');
            data.forEach(d => {
                if (d.bmi > 27) {
                    list.innerHTML += `<div class="p-4 bg-red-50 border-l-4 border-red-500 text-red-700 font-medium rounded shadow-sm">${d.name}: BMI 異常 (${d.bmi})</div>`;
                }
            });
        }

        function showDemoMode() {
            document.getElementById('connection-status').innerText = "DEMO MODE";
            document.getElementById('connection-status').className = "px-3 py-1 rounded-full text-xs font-black bg-blue-500 text-white";
            document.getElementById('disp-name').innerText = "測試人員 (林o恩)";
            document.getElementById('disp-id').innerText = "DEMO-12345";
            renderUI(backupData);
        }

        window.onload = initializeApp;
    </script>
</body>
</html>
